<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Odoo × ERP</title>
    <meta name="description" content="Odoo × ERP - Inventory, Sales, Purchase, Manufacturing Management">
    <link rel="stylesheet" href="css/style.css?v=10">
</head>
<body>
    <div id="app">
        <!-- Login Page -->
        <div id="login-page" class="login-container">
            <!-- animated odoo-inspired shapes -->
            <div class="login-bg" aria-hidden="true">
                <span class="ls ls-hex ls-1"></span>
                <span class="ls ls-circle ls-2"></span>
                <span class="ls ls-cube ls-3"></span>
                <span class="ls ls-ring ls-4"></span>
                <span class="ls ls-circle ls-5"></span>
                <span class="ls ls-hex ls-6"></span>
                <span class="ls ls-cube ls-7"></span>
                <span class="ls ls-ring ls-8"></span>
                <span class="ls ls-dot ls-9"></span>
                <span class="ls ls-dot ls-10"></span>
            </div>

            <div class="login-stage">
                <h1 class="login-brand">Odoo<span class="brand-x"> × </span>ERP</h1>
                <p class="login-tagline">Enterprise Resource Planning</p>

                <div class="login-box glass">
                    <p class="login-subtitle" id="login-subtitle">Sign in to your workspace</p>
                    <form id="login-form">
                        <div class="form-group">
                            <label for="login-email">Email</label>
                            <input type="email" id="login-email" placeholder="you@erp.com" required>
                        </div>
                        <div class="form-group">
                            <label for="login-password">Password</label>
                            <input type="password" id="login-password" placeholder="••••••••" required>
                        </div>
                        <div class="login-options">
                            <label class="remember-me"><input type="checkbox" id="login-remember"><span>Remember me</span></label>
                            <a href="#" id="forgot-password" class="forgot-link">Forgot password?</a>
                        </div>
                        <button type="submit" class="btn btn-primary btn-block">Sign In</button>
                        <p id="login-error" class="error-text"></p>
                    </form>
                </div>
            </div>
        </div>

        <!-- Main App -->
        <div id="main-app" class="main-layout" style="display:none;">
            <!-- Sidebar -->
            <aside id="sidebar" class="sidebar">
                <div class="sidebar-header">
                    <h2>Odoo × ERP</h2>
                    <span id="user-role-badge" class="role-badge"></span>
                </div>
                <nav id="sidebar-nav"></nav>
                <div class="sidebar-footer">
                    <span id="user-name-display"></span>
                    <button id="logout-btn" class="btn btn-sm btn-danger">Logout</button>
                </div>
            </aside>

            <!-- Content -->
            <main id="content" class="content">
                <div id="page-header" class="page-header">
                    <h1 id="page-title">Dashboard</h1>
                    <div id="header-actions"></div>
                </div>
                <div id="page-content"></div>
            </main>
        </div>
    </div>

    <!-- Modal -->
    <div id="modal-overlay" class="modal-overlay" style="display:none;">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modal-title"></h3>
                <button id="modal-close" class="modal-close">&times;</button>
            </div>
            <div id="modal-body" class="modal-body"></div>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast-container" class="toast-container"></div>

    <script src="js/api.js"></script>
    <script src="js/pages/dashboard.js?v=3"></script>
    <script src="js/pages/users.js"></script>
    <script src="js/pages/products.js?v=3"></script>
    <script src="js/pages/customers.js"></script>
    <script src="js/pages/suppliers.js"></script>
    <script src="js/pages/inventory.js?v=3"></script>
    <script src="js/pages/bom.js"></script>
    <script src="js/pages/sales.js?v=4"></script>
    <script src="js/pages/purchase.js?v=4"></script>
    <script src="js/pages/manufacturing.js?v=4"></script>
    <script src="js/pages/audit_notifications.js"></script>
    <script src="js/app.js?v=9"></script>
</body>
</html>
