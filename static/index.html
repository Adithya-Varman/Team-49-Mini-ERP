<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini ERP System</title>
    <meta name="description" content="Mini ERP System - Inventory, Sales, Purchase, Manufacturing Management">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div id="app">
        <!-- Login Page -->
        <div id="login-page" class="login-container">
            <div class="login-box">
                <h1>Mini ERP</h1>
                <p class="login-subtitle">Enterprise Resource Planning</p>
                <form id="login-form">
                    <div class="form-group">
                        <label for="login-email">Email</label>
                        <input type="email" id="login-email" placeholder="admin@erp.com" required>
                    </div>
                    <div class="form-group">
                        <label for="login-password">Password</label>
                        <input type="password" id="login-password" placeholder="password" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block">Login</button>
                    <p id="login-error" class="error-text"></p>
                </form>
            </div>
        </div>

        <!-- Main App -->
        <div id="main-app" class="main-layout" style="display:none;">
            <!-- Sidebar -->
            <aside id="sidebar" class="sidebar">
                <div class="sidebar-header">
                    <h2>Mini ERP</h2>
                    <span id="user-role-badge" class="role-badge"></span>
                </div>
                <nav id="sidebar-nav"></nav>
                <div class="sidebar-footer">
                    <span id="user-name-display"></span>
                    <button id="logout-btn" class="btn btn-sm btn-danger">Logout</button>
                </div>
            </aside>

            <!-- Content -->
            <main id="content" class="content">
                <div id="page-header" class="page-header">
                    <h1 id="page-title">Dashboard</h1>
                    <div id="header-actions"></div>
                </div>
                <div id="page-content"></div>
            </main>
        </div>
    </div>

    <!-- Modal -->
    <div id="modal-overlay" class="modal-overlay" style="display:none;">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modal-title"></h3>
                <button id="modal-close" class="modal-close">&times;</button>
            </div>
            <div id="modal-body" class="modal-body"></div>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast-container" class="toast-container"></div>

    <script src="/js/api.js"></script>
    <script src="/js/pages/dashboard.js"></script>
    <script src="/js/pages/users.js"></script>
    <script src="/js/pages/products.js"></script>
    <script src="/js/pages/customers.js"></script>
    <script src="/js/pages/suppliers.js"></script>
    <script src="/js/pages/inventory.js"></script>
    <script src="/js/pages/bom.js"></script>
    <script src="/js/pages/sales.js"></script>
    <script src="/js/pages/purchase.js"></script>
    <script src="/js/pages/manufacturing.js"></script>
    <script src="/js/pages/audit_notifications.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
