<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>oddo x erp — Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --odoo-purple: #714B67;
    --odoo-purple-light: #8f6f86;
    --odoo-violet: #875A7B;
    --odoo-accent: #a16fb8;
    --grey: #6b7280;
    --grey-light: #c7cad1;
    --text-dark: #2b2331;
    --text-soft: #5c5566;
    --glass-bg: rgba(255, 255, 255, 0.14);
    --glass-border: rgba(255, 255, 255, 0.28);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: #000000;
    color: var(--text-dark);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  /* Subtle radial wash so purple reads against black */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
      radial-gradient(60% 50% at 50% 0%, rgba(113, 75, 103, 0.35), transparent 70%),
      radial-gradient(50% 60% at 85% 90%, rgba(135, 90, 123, 0.28), transparent 70%),
      radial-gradient(45% 55% at 10% 80%, rgba(107, 114, 128, 0.20), transparent 70%);
    z-index: 0;
  }

  /* ---------- Animated Odoo shapes ---------- */
  .shapes { position: fixed; inset: 0; z-index: 1; overflow: hidden; pointer-events: none; }

  .shape {
    position: absolute;
    opacity: 0.55;
    will-change: transform;
    filter: drop-shadow(0 8px 30px rgba(113, 75, 103, 0.35));
  }

  /* The Odoo-style purple blob / pill */
  .blob {
    border-radius: 42% 58% 63% 37% / 41% 44% 56% 59%;
    background: linear-gradient(135deg, var(--odoo-purple), var(--odoo-accent));
  }
  .ring {
    border-radius: 50%;
    background: transparent;
    border: 6px solid var(--odoo-violet);
  }
  .pill {
    border-radius: 999px;
    background: linear-gradient(135deg, var(--grey), var(--odoo-purple-light));
  }
  .square {
    border-radius: 28%;
    background: linear-gradient(135deg, var(--odoo-accent), var(--odoo-violet));
    transform: rotate(20deg);
  }
  .triangle {
    width: 0 !important; height: 0 !important;
    border-left: 45px solid transparent;
    border-right: 45px solid transparent;
    border-bottom: 78px solid var(--odoo-purple-light);
    background: none !important;
    border-radius: 8px;
  }

  /* ---------- Login layout ---------- */
  .stage {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 440px;
    padding: 24px;
    text-align: center;
  }

  .brand {
    margin-bottom: 26px;
  }
  .brand h1 {
    font-size: 40px;
    font-weight: 800;
    letter-spacing: -0.02em;
    color: #fff;
    text-shadow: 0 4px 24px rgba(113, 75, 103, 0.55);
  }
  .brand h1 .x {
    color: var(--odoo-accent);
    font-style: italic;
    padding: 0 4px;
  }
  .brand p {
    margin-top: 8px;
    font-size: 13px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.55);
  }

  /* Frosted glass card */
  .card {
    position: relative;
    background: var(--glass-bg);
    backdrop-filter: blur(26px) saturate(180%);
    -webkit-backdrop-filter: blur(26px) saturate(180%);
    border: 1px solid var(--glass-border);
    border-radius: 28px;
    padding: 34px 32px 38px;
    box-shadow:
      0 20px 60px rgba(0, 0, 0, 0.55),
      inset 0 1px 0 rgba(255, 255, 255, 0.4),
      inset 0 -1px 0 rgba(255, 255, 255, 0.08);
    overflow: hidden;
  }
  /* glossy top highlight like apple glass */
  .card::after {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 50%;
    background: linear-gradient(to bottom, rgba(255,255,255,0.18), transparent);
    pointer-events: none;
  }

  /* Role switcher */
  .switch {
    position: relative;
    display: flex;
    background: rgba(255,255,255,0.16);
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 14px;
    padding: 5px;
    margin-bottom: 26px;
  }
  .switch .thumb {
    position: absolute;
    top: 5px;
    left: 5px;
    width: calc(50% - 5px);
    height: calc(100% - 10px);
    border-radius: 10px;
    background: linear-gradient(135deg, var(--odoo-purple), var(--odoo-violet));
    box-shadow: 0 6px 18px rgba(113, 75, 103, 0.5);
    transition: transform 0.35s cubic-bezier(0.65, 0, 0.35, 1);
  }
  .switch button {
    position: relative;
    z-index: 1;
    flex: 1;
    border: none;
    background: transparent;
    padding: 11px 0;
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    color: rgba(255,255,255,0.7);
    cursor: pointer;
    transition: color 0.3s;
  }
  .switch button.active { color: #fff; }
  .switch[data-role="admin"] .thumb { transform: translateX(100%); }

  .field { text-align: left; margin-bottom: 16px; }
  .field label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.04em;
    color: rgba(255,255,255,0.75);
    margin-bottom: 7px;
  }
  .field input {
    width: 100%;
    padding: 13px 15px;
    border-radius: 13px;
    border: 1px solid rgba(255,255,255,0.28);
    background: rgba(255,255,255,0.12);
    color: #fff;
    font-family: inherit;
    font-size: 14px;
    outline: none;
    transition: border 0.25s, background 0.25s, box-shadow 0.25s;
  }
  .field input::placeholder { color: rgba(255,255,255,0.45); }
  .field input:focus {
    border-color: var(--odoo-accent);
    background: rgba(255,255,255,0.18);
    box-shadow: 0 0 0 3px rgba(161, 111, 184, 0.3);
  }

  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 6px 2px 22px;
    font-size: 12.5px;
  }
  .row label { display: flex; align-items: center; gap: 7px; color: rgba(255,255,255,0.75); cursor: pointer; }
  .row input { accent-color: var(--odoo-accent); }
  .row a { color: var(--odoo-accent); text-decoration: none; font-weight: 600; }
  .row a:hover { text-decoration: underline; }

  .submit {
    width: 100%;
    padding: 14px 0;
    border: none;
    border-radius: 14px;
    background: linear-gradient(135deg, var(--odoo-purple), var(--odoo-violet));
    color: #fff;
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.02em;
    cursor: pointer;
    box-shadow: 0 10px 26px rgba(113, 75, 103, 0.5);
    transition: transform 0.15s, box-shadow 0.25s, filter 0.2s;
  }
  .submit:hover { filter: brightness(1.08); box-shadow: 0 14px 32px rgba(113, 75, 103, 0.6); }
  .submit:active { transform: translateY(1px) scale(0.99); }

  .role-hint {
    margin-top: 18px;
    font-size: 12.5px;
    color: rgba(255,255,255,0.6);
  }
  .role-hint b { color: var(--odoo-accent); }

  .foot {
    margin-top: 22px;
    font-size: 11.5px;
    color: rgba(255,255,255,0.4);
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>
  <div class="shapes" id="shapes"></div>

  <div class="stage">
    <div class="brand">
      <h1>oddo<span class="x">x</span>erp</h1>
      <p>Enterprise Resource Planning</p>
    </div>

    <div class="card">
      <div class="switch" id="switch" data-role="user">
        <span class="thumb"></span>
        <button class="active" data-role="user">User</button>
        <button data-role="admin">Admin</button>
      </div>

      <form id="loginForm">
        <div class="field">
          <label id="idLabel">Email Address</label>
          <input id="idInput" type="text" placeholder="you@company.com" autocomplete="username" />
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" placeholder="••••••••" autocomplete="current-password" />
        </div>

        <div class="row">
          <label><input type="checkbox" /> Remember me</label>
          <a href="#">Forgot password?</a>
        </div>

        <button class="submit" type="submit" id="submitBtn">Sign in as User</button>
      </form>

      <p class="role-hint" id="roleHint">Signing in to your <b>workspace</b> dashboard.</p>
    </div>

    <p class="foot">© 2026 oddo x erp · Secured workspace access</p>
  </div>

<script>
  /* ---------- Role switching ---------- */
  const sw = document.getElementById('switch');
  const buttons = sw.querySelectorAll('button');
  const submitBtn = document.getElementById('submitBtn');
  const idLabel = document.getElementById('idLabel');
  const idInput = document.getElementById('idInput');
  const roleHint = document.getElementById('roleHint');

  const config = {
    user: {
      label: 'Email Address',
      placeholder: 'you@company.com',
      btn: 'Sign in as User',
      hint: 'Signing in to your <b>workspace</b> dashboard.'
    },
    admin: {
      label: 'Admin ID',
      placeholder: 'admin@company.com',
      btn: 'Sign in as Admin',
      hint: 'Elevated access to the <b>admin control panel</b>.'
    }
  };

  buttons.forEach(b => b.addEventListener('click', () => {
    const role = b.dataset.role;
    sw.dataset.role = role;
    buttons.forEach(x => x.classList.toggle('active', x === b));
    const c = config[role];
    idLabel.textContent = c.label;
    idInput.placeholder = c.placeholder;
    submitBtn.textContent = c.btn;
    roleHint.innerHTML = c.hint;
  }));

  document.getElementById('loginForm').addEventListener('submit', e => {
    e.preventDefault();
    submitBtn.textContent = 'Authenticating…';
    setTimeout(() => {
      submitBtn.textContent = config[sw.dataset.role].btn;
    }, 1400);
  });

  /* ---------- Animated Odoo shapes ---------- */
  const stage = document.getElementById('shapes');
  const kinds = ['blob', 'ring', 'pill', 'square', 'triangle'];
  const shapes = [];
  const COUNT = 14;

  function rand(min, max) { return Math.random() * (max - min) + min; }

  for (let i = 0; i < COUNT; i++) {
    const el = document.createElement('div');
    const kind = kinds[Math.floor(Math.random() * kinds.length)];
    el.className = 'shape ' + kind;

    if (kind !== 'triangle') {
      const size = rand(40, 130);
      el.style.width = size + 'px';
      el.style.height = (kind === 'pill' ? size * 0.45 : size) + 'px';
    }
    el.style.opacity = rand(0.25, 0.6);

    const s = {
      el,
      x: rand(0, window.innerWidth),
      y: rand(0, window.innerHeight),
      vx: rand(-0.5, 0.5),
      vy: rand(-0.5, 0.5),
      rot: rand(0, 360),
      vr: rand(-0.4, 0.4),
      // randomly nudged target velocities for the "consistent random" drift
      targetVx: rand(-0.6, 0.6),
      targetVy: rand(-0.6, 0.6)
    };
    shapes.push(s);
    stage.appendChild(el);
  }

  // Periodically pick new random drift targets so motion stays alive & random
  setInterval(() => {
    shapes.forEach(s => {
      s.targetVx = rand(-0.7, 0.7);
      s.targetVy = rand(-0.7, 0.7);
    });
  }, 2600);

  function tick() {
    const w = window.innerWidth, h = window.innerHeight;
    shapes.forEach(s => {
      // ease velocity toward random target
      s.vx += (s.targetVx - s.vx) * 0.01;
      s.vy += (s.targetVy - s.vy) * 0.01;
      s.x += s.vx;
      s.y += s.vy;
      s.rot += s.vr;

      // wrap around edges
      const m = 160;
      if (s.x < -m) s.x = w + m;
      if (s.x > w + m) s.x = -m;
      if (s.y < -m) s.y = h + m;
      if (s.y > h + m) s.y = -m;

      s.el.style.transform = `translate(${s.x}px, ${s.y}px) rotate(${s.rot}deg)`;
    });
    requestAnimationFrame(tick);
  }
  tick();

  window.addEventListener('resize', () => {
    shapes.forEach(s => {
      s.x = Math.min(s.x, window.innerWidth);
      s.y = Math.min(s.y, window.innerHeight);
    });
  });
</script>
</body>
</html>
